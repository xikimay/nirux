<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nirux Editor</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #20202A; overflow: hidden; }
      #editor, #diff-editor, #pierre-diff, #markdown-view { position: absolute; inset: 0; }
      #diff-editor, #pierre-diff { display: none; }
      #pierre-diff {
        background: #20202A;
        overflow: auto;
      }
      /* A Markdown tab's reading view (bridge.js), in Theme's colours. */
      #markdown-view {
        display: none;
        overflow: auto;
        outline: none;
        color: #ECECF1;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #markdown-view .markdown { max-width: 760px; margin: 0 auto; padding: 24px 32px 48px; overflow-wrap: anywhere; }
      #markdown-view .markdown > :first-child { margin-top: 0; }
      #markdown-view p, #markdown-view ul, #markdown-view ol, #markdown-view blockquote, #markdown-view pre, #markdown-view table { margin: 0 0 12px; }
      #markdown-view h1, #markdown-view h2, #markdown-view h3, #markdown-view h4, #markdown-view h5, #markdown-view h6 {
        margin: 24px 0 10px;
        line-height: 1.3;
        font-weight: 600;
      }
      #markdown-view h1 { font-size: 24px; }
      #markdown-view h2 { font-size: 20px; }
      #markdown-view h3 { font-size: 17px; }
      #markdown-view h4, #markdown-view h5, #markdown-view h6 { font-size: 14px; }
      #markdown-view h1, #markdown-view h2 { padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
      #markdown-view ul, #markdown-view ol { padding-left: 24px; }
      #markdown-view li + li { margin-top: 2px; }
      #markdown-view li > ul, #markdown-view li > ol { margin: 2px 0 0; }
      #markdown-view li.task { list-style: none; margin-left: -20px; }
      #markdown-view .check, #markdown-view .dead-link { color: #A0A0AD; }
      #markdown-view blockquote { padding-left: 12px; border-left: 3px solid rgba(255, 255, 255, 0.12); color: #A0A0AD; }
      #markdown-view blockquote > :last-child { margin-bottom: 0; }
      #markdown-view code { padding: 1px 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); font: 0.9em ui-monospace, "SF Mono", Menlo, monospace; }
      #markdown-view pre {
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 6px;
        background: #1B1B23;
        font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        white-space: pre-wrap;
      }
      #markdown-view hr { margin: 20px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.12); }
      #markdown-view a { color: #78A3F7; text-decoration: none; cursor: pointer; }
      #markdown-view a:hover { text-decoration: underline; }
      /* A wide table scrolls inside its block. */
      #markdown-view table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      #markdown-view th, #markdown-view td { padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.12); text-align: left; vertical-align: top; }
      #markdown-view th { font-weight: 600; background: #292933; }
      .checkpoint-patch { margin: 12px; color: #ECECF1; font: 13px/1.5 ui-monospace, Menlo, monospace; }
      /* Outer styles win over the bundle's :host rule. */
      .nirux-pierre-host {
        background: #20202A;
        display: block;
        min-height: 120px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .nirux-pierre-host.nirux-pierre-collapsed {
        display: none;
      }
      .nirux-pierre-stack {
        min-height: 100%;
        padding-bottom: 48px;
      }
      .nirux-pierre-summary {
        position: sticky;
        top: 0;
        z-index: 4;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 12px;
        color: #ECECF1;
        background: #1B1B23;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .nirux-pierre-summary-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .nirux-pierre-summary-count {
        flex: none;
        color: #A0A0AD;
      }
      .nirux-pierre-file-header {
        position: sticky;
        top: 34px;
        z-index: 3;
        width: 100%;
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        color: #ECECF1;
        background: #292933;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: left;
        cursor: default;
      }
      .nirux-pierre-file-header:hover {
        background: #30303B;
      }
      .nirux-pierre-file-header.collapsed {
        color: #A0A0AD;
      }
      .nirux-pierre-file-chevron {
        flex: none;
        width: 12px;
        color: #A0A0AD;
      }
      .nirux-pierre-file-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: #A0A0AD; font: 13px -apple-system, system-ui, sans-serif;
        background: #20202A;
        pointer-events: none;
        transition: opacity 200ms ease-out;
      }
      #status.hidden { opacity: 0; }
    </style>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="vs/editor/editor.main.css" />
    <style>
      .monaco-diff-editor .line-insert,
      .monaco-editor .line-insert {
        background-color: rgba(34, 197, 94, 0.20) !important;
        border-left: 3px solid #45d987 !important;
      }
      .monaco-diff-editor .line-delete,
      .monaco-editor .line-delete {
        background-color: rgba(239, 68, 68, 0.22) !important;
        border-left: 3px solid #ff6b7d !important;
      }
      .monaco-diff-editor .char-insert,
      .monaco-editor .char-insert {
        background-color: rgba(69, 217, 135, 0.34) !important;
        outline: 1px solid rgba(69, 217, 135, 0.45) !important;
      }
      .monaco-diff-editor .char-delete,
      .monaco-editor .char-delete,
      .monaco-editor .inline-deleted-text {
        background-color: rgba(255, 107, 125, 0.34) !important;
        outline: 1px solid rgba(255, 107, 125, 0.45) !important;
      }
      .monaco-diff-editor .gutter-insert,
      .monaco-editor .gutter-insert,
      .monaco-editor .inline-added-margin-view-zone {
        background-color: rgba(69, 217, 135, 0.7) !important;
      }
      .monaco-diff-editor .gutter-delete,
      .monaco-editor .gutter-delete,
      .monaco-editor .inline-deleted-margin-view-zone {
        background-color: rgba(255, 107, 125, 0.7) !important;
      }
      .monaco-diff-editor .insert-sign,
      .monaco-editor .insert-sign {
        color: #45d987 !important;
        opacity: 1 !important;
      }
      .monaco-diff-editor .delete-sign,
      .monaco-editor .delete-sign {
        color: #ff6b7d !important;
        opacity: 1 !important;
      }
      .monaco-diff-editor .view-overlays .current-line,
      .monaco-diff-editor .margin-view-overlays .current-line,
      .monaco-diff-editor .margin-view-overlays .current-line-margin,
      .monaco-diff-editor .view-overlays .current-line-exact {
        background-color: transparent !important;
        border-color: transparent !important;
      }
      .monaco-editor .nirux-diff-line-insert,
      .monaco-editor .view-overlays .nirux-diff-line-insert {
        background-color: rgba(34, 197, 94, 0.18) !important;
        box-shadow: inset 4px 0 0 #45d987 !important;
      }
      .monaco-editor .nirux-diff-line-delete,
      .monaco-editor .view-overlays .nirux-diff-line-delete {
        background-color: rgba(239, 68, 68, 0.20) !important;
        box-shadow: inset 4px 0 0 #ff6b7d !important;
      }
      .monaco-editor .nirux-diff-gutter-insert,
      .monaco-editor .nirux-diff-margin-insert,
      .monaco-editor .nirux-diff-line-number-insert {
        background-color: rgba(69, 217, 135, 0.58) !important;
        color: #eafff3 !important;
      }
      .monaco-editor .nirux-diff-gutter-delete,
      .monaco-editor .nirux-diff-margin-delete,
      .monaco-editor .nirux-diff-line-number-delete {
        background-color: rgba(255, 107, 125, 0.58) !important;
        color: #fff0f2 !important;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div id="diff-editor"></div>
    <div id="pierre-diff"></div>
    <div id="markdown-view" tabindex="-1"></div>
    <div id="status">Loading editor…</div>

    <script>
      // Local Monaco — bundled in app resources, no network required.
      var require = { paths: { vs: "vs" } };

      // WKWebView blocks Web Workers loaded from file:// URLs, and our lite
      // Monaco build doesn't include language services that need them. Stub
      // out getWorker so Monaco runs single-threaded without errors.
      window.MonacoEnvironment = {
        getWorker: function () {
          return {
            postMessage: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            terminate: function () {}
          };
        }
      };
    </script>
    <script src="vs/loader.js"></script>
    <script src="pierre-diff.bundle.js"></script>
    <script src="review-page.js"></script>
    <script src="markdown-view.js"></script>
    <script src="bridge.js"></script>
  </body>
</html>
