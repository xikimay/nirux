name: Flake gate

# The flake gate of a new or reworked test class, in one job on one macOS
# runner: each class runs N times, each run its own xctest process, beside
# the six heaviest classes (scripts/run-tests.sh --repeat). Started by hand
# on a branch, so it needs no throwaway pull request:
#   gh workflow run flake-gate.yml --ref <branch> -f classes="NiruxTests.FooTests" [-f runs=10]
on:
  workflow_dispatch:
    inputs:
      classes:
        description: Test classes (Module.Class), separated by spaces
        required: true
        type: string
      runs:
        description: Runs of each class
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The cache tests.yml and the nightly use.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      - name: Probe closure
        run: |
          swift --version
          B=$(find .build -type f -name NiruxPackageTests -path "*MacOS*" | head -1)
          echo "binary $B"
          for s in $(nm "$B" | awk '$3 ~ /TaskSpaceToolsFlow.*fU_$/ {print $3}'); do
            echo "== $s"
            echo "$s" | xcrun swift-demangle
            objdump -d --disassemble-symbols="$s" "$B" | grep -E "\sbl\s" | sed -E 's/.*<(.*)>.*/\1/' | xcrun swift-demangle --simplified | head -12
          done

      - name: Repeat the classes
        env:
          CLASSES: ${{ inputs.classes }}
          RUNS: ${{ inputs.runs }}
        run: |
          read -ra classes <<< "${CLASSES//$'\n'/ }"
          scripts/run-tests.sh --repeat "$RUNS" "${classes[@]}"

      # Probe only (DO NOT MERGE): what a crashed xctest left.
      - name: Crash diagnostics
        if: always()
        run: |
          sleep 45
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -20
          for f in ~/Library/Logs/DiagnosticReports/xctest*; do
            [ -f "$f" ] || continue
            echo "=== $f"
            /usr/bin/python3 -B - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          _, _, body = text.partition("\n")
          r = json.loads(body)
          print("exception", r.get("exception"))
          print("asi", r.get("asi"))
          imgs = r.get("usedImages", [])
          for t in r.get("threads", []):
              if t.get("triggered"):
                  print("thread", t.get("queue"), t.get("name"))
                  for fr in t.get("frames", [])[:45]:
                      i = fr.get("imageIndex", 0)
                      name = imgs[i].get("name", "?") if i < len(imgs) else "?"
                      print(" ", name, fr.get("symbol", ""), fr.get("imageOffset"))
          PY
          done
          log show --last 40m --style compact --predicate 'eventMessage CONTAINS "BUG IN CLIENT" OR eventMessage CONTAINS "Fatal error" OR eventMessage CONTAINS "Incorrect actor" OR eventMessage CONTAINS "isolation"' 2>/dev/null | tail -40
