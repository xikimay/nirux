name: Early XCTest consumer proof
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 7
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build
        uses: ./.github/actions/ci-diagnostic
        with:
          command: build
      - name: Start an independent reader
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup bash -c '
            scripts/watch-ci-failure.sh "$GITHUB_RUN_ID" > "$RUNNER_TEMP/receipt"; result=$?
            if [[ "$result" == 1 ]] && jq -e --arg sha "$GITHUB_SHA" '\''(.checkout == $sha) and (.phase == "suite") and (.message|contains("early XCTest diagnostic fixture"))'\'' "$RUNNER_TEMP/receipt"; then
              date -u > "$RUNNER_TEMP/consumer-read-diagnostic"
            fi
          ' > "$RUNNER_TEMP/reader.log" 2>&1 < /dev/null &
      - name: Run tests
        id: tests
        continue-on-error: true
        uses: ./.github/actions/ci-diagnostic
        with:
          command: suite
      - name: Verify reader and final failure
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          cat "$RUNNER_TEMP/reader.log" "$RUNNER_TEMP/receipt"
          test -s "$RUNNER_TEMP/consumer-read-diagnostic"
          test "$OUTCOME" = failure
