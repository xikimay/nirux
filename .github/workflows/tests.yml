name: Tests

# DO NOT MERGE: measures `swift test --parallel` against a class-level runner.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftpm-parallel:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Machine
        run: sysctl -n hw.activecpu hw.memsize; swift --version
      - name: Build
        run: swift build --build-tests
      - name: swift test --parallel
        run: swift test --skip-build --parallel

  class-queue:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build --build-tests
      - name: Class queue, 3 workers
        run: scripts/run-tests.sh 3
      - name: Class queue, 6 workers
        if: always()
        run: scripts/run-tests.sh 6
