name: Tests

# Runs the suite on every PR into main so mergeStateStatus reflects it before
# merge: an actor-isolation error in a test file once reached main red
# (2026-07-19, ActivityStoreTests). Not on push to main: the nightly
# (nightly.yml) already runs the tests there, and a second run held another
# macOS runner on every merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # DO NOT MERGE: the two flaky tests, many times under the suite's load.
    name: repro ${{ matrix.round }}
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        id: build
        run: swift build --build-tests

      - name: CatchUpTests beside the classes that ran with it
        run: >
          scripts/zz-repro.sh NiruxTests.CatchUpTests 660
          NiruxTests.BranchReviewExplainTests NiruxTests.BranchReviewSnapshotTests
          NiruxTests.BranchReviewSwiftReadingTests NiruxTests.BranchReviewTestsAgainstCodeTests
          NiruxTests.BranchReviewWatchTests

      - name: MissionTests beside the classes that ran with it
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          scripts/zz-repro.sh NiruxTests.MissionTests 240
          NiruxTests.LeadToolsFlowTests NiruxTests.MenuBarFlowTests
          NiruxTests.MergeQueueBoardFlowTests NiruxTests.NewTaskFlowTests
          NiruxTests.PaletteCommandFlowTests
