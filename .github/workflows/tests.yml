name: Tests

# DO NOT MERGE: per-class coverage map for the fast-CI study. Runs the suite
# once with coverage, one profile per class, and uploads which source lines
# each class runs.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build with coverage
        run: swift build --build-tests --enable-code-coverage

      - name: Run tests, one profile per class
        env:
          NIRUX_TESTS_PROFILES: ${{ runner.temp }}/profiles
        run: |
          mkdir -p "$NIRUX_TESTS_PROFILES"
          scripts/run-tests.sh || echo "::warning::some classes failed under coverage"

      - name: Lines each class runs
        env:
          NIRUX_TESTS_PROFILES: ${{ runner.temp }}/profiles
          OUT: ${{ runner.temp }}/coverage-map
        run: |
          mkdir -p "$OUT"
          bin="$(swift build --show-bin-path)"
          export BUNDLE="$bin/NiruxPackageTests.xctest/Contents/MacOS/NiruxPackageTests" APP="$bin/Nirux"
          ls "$NIRUX_TESTS_PROFILES" | sed -E 's/\.[0-9]+\.profraw$//' | sort -u > "$OUT/classes"
          echo "$(wc -l < "$OUT/classes") classes with a profile"
          xargs -P 3 -n 1 bash -c '
            set -euo pipefail
            class="$1"
            xcrun llvm-profdata merge -sparse "$NIRUX_TESTS_PROFILES/$class".*.profraw -o "$RUNNER_TEMP/$class.profdata"
            xcrun llvm-cov export -format=lcov -skip-functions -instr-profile "$RUNNER_TEMP/$class.profdata" "$BUNDLE" -object "$APP" \
              -ignore-filename-regex "/\.build/|/Tests/" |
              awk -F"[:,]" "/^SF:/ { f = \$2; sub(/.*\/Sources\//, \"Sources/\", f) } /^DA:/ && \$3 > 0 { print f \":\" \$2 }" > "$OUT/$class.lines"
            rm "$RUNNER_TEMP/$class.profdata"
          ' _ < "$OUT/classes"
          tar -czf "$RUNNER_TEMP/coverage-map.tgz" -C "$OUT" .
          ls -la "$RUNNER_TEMP/coverage-map.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-map
          path: ${{ runner.temp }}/coverage-map.tgz
          retention-days: 30
