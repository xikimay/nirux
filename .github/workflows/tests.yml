name: Tests

# Runs the suite on every PR into main so mergeStateStatus reflects it before
# merge: an actor-isolation error in a test file once reached main red
# (2026-07-19, ActivityStoreTests). Not on push to main: the nightly
# (nightly.yml) already runs the tests there, and a second run held another
# macOS runner on every merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # Xcode 26.3 (Swift 6.2) rather than the image's default 16.4 (Swift
    # 6.1): libghostty-spm 2.2 needs Swift tools 6.2.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # A serial run took 13 minutes: a hung test fails the job instead of
    # holding the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, as the nightly has it: a test that reads a
          # merged pull request's commits runs here, before merge, rather
          # than first in the nightly.
          fetch-depth: 0

      # The dependencies' clones and binaries (GhosttyKit's download sometimes
      # fails to connect), per toolchain: a new runner image's SwiftPM starts
      # afresh. A pull request reads the cache the nightly saves on main;
      # build products aren't cached (a stale one once crashed tests).
      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: scripts/run-tests.sh

      # DO NOT MERGE: the class with a new timed test, several times at
      # once next to heavy classes, then the reverts that test must catch.
      - name: Repeat TurnEndClassificationTests
        run: scripts/repeat-class.sh NiruxTests.TurnEndClassificationTests 12 6 NiruxTests.SettingsWindowTests NiruxTests.MenuBarFlowTests NiruxTests.LeadToolsFlowTests

      - name: Reverts TurnEndClassificationTests catches
        run: scripts/mutants-class.sh NiruxTests.TurnEndClassificationTests no-note note-unwatched note-child note-option-off
