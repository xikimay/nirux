name: Tests

# Runs on every PR into main so mergeStateStatus reflects it before merge: an
# actor-isolation error in a test file once reached main red (2026-07-19,
# ActivityStoreTests). Not on push to main: the nightly (nightly.yml) already
# runs the tests there.
#
# The full suite, the "test" check the ruleset requires, runs on a train
# (nirux-train/*) and on a pull request labelled full-test, which the
# queue's Standard cadence adds to one it merges itself. Any other pull
# request lands in a train, which runs the suite on its code again: it runs
# only the test classes its changes reach, under its own check name,
# "test (selected)".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Any other label starts a run that does nothing: a group of its own keeps
  # it from cancelling the run in progress.
  group: tests-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-test' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The train tests its riders' code: their own runs would only hold
  # runners.
  riders:
    if: startsWith(github.head_ref, 'nirux-train/') && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cancel-rider-runs.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  core:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-test'
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-core.sh
      - run: scripts/check-core-boundary.sh
      - name: Test canary runner
        run: /usr/bin/python3 -B -m unittest discover -s scripts/canary -v

  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-test'
    name: ${{ (startsWith(github.head_ref, 'nirux-train/') || contains(github.event.pull_request.labels.*.name, 'full-test')) && 'test' || 'test (selected)' }}
    runs-on: macos-15
    # Xcode 26.3 (Swift 6.2) rather than the image's default 16.4 (Swift
    # 6.1): libghostty-spm 2.2 needs Swift tools 6.2.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SELECTED: ${{ !(startsWith(github.head_ref, 'nirux-train/') || contains(github.event.pull_request.labels.*.name, 'full-test')) }}
    # A serial run took 13 minutes: a hung test fails the job instead of
    # holding the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, as the nightly has it: a test that reads a
          # merged pull request's commits runs here, before merge, rather
          # than first in the nightly.
          fetch-depth: 0

      # The dependencies' clones and binaries (GhosttyKit's download sometimes
      # fails to connect), per toolchain: a new runner image's SwiftPM starts
      # afresh. A pull request reads the cache the nightly saves on main.
      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      # The dependencies' build products, which the nightly saves on main for
      # this toolchain and Package.resolved, so they don't compile again
      # (45 s of the build). This package's modules aren't in it and always
      # build from scratch: a stale object of ours once crashed tests. A
      # dependency left out here only builds, it can't go stale.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/arm64-apple-macosx/debug/GhosttyKit.build
            .build/arm64-apple-macosx/debug/DisplayLink.build
            .build/arm64-apple-macosx/debug/GhosttyTerminal.build
            .build/arm64-apple-macosx/debug/Modules/GhosttyKit.*
            .build/arm64-apple-macosx/debug/Modules/DisplayLink.*
            .build/arm64-apple-macosx/debug/Modules/GhosttyTerminal.*
          key: deps-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        uses: ./.github/actions/ci-diagnostic
        with:
          command: build

      # The latest index the Coverage map workflow saved on main.
      - name: Coverage index
        id: coverage
        if: env.SELECTED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .build/coverage-index.txt
          key: coverage-index-v2-${{ github.event.pull_request.base.sha }}
          restore-keys: coverage-index-v2-

      - name: Select tests
        shell: bash
        id: select
        env:
          INDEX_KEY: ${{ steps.coverage.outputs.cache-matched-key }}
        if: env.SELECTED == 'true'
        run: |
          revision="${INDEX_KEY#coverage-index-v2-}"
          if [[ ! -s .build/coverage-index.txt || ! $revision =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$revision" HEAD^1; then
            echo "No coverage index from the base history. Running the whole suite."
            exit 0
          fi
          git diff --no-renames --name-only -z "$revision" HEAD > "$RUNNER_TEMP/changed"
          swift test list --skip-build | cut -d/ -f1 | sort -u > "$RUNNER_TEMP/test-classes"
          status=0
          scripts/select-tests.sh .build/coverage-index.txt "$RUNNER_TEMP/test-classes" < "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/selected" || status=$?
          if [[ $status -eq 0 ]]; then
            echo "$(wc -l < "$RUNNER_TEMP/selected" | tr -d ' ') classes selected:"
            cat "$RUNNER_TEMP/selected"
            echo "only=$RUNNER_TEMP/selected" >> "$GITHUB_OUTPUT"
          elif [[ $status -ne 3 ]]; then
            exit "$status"
          fi

      - name: Run tests
        # A warning past it, not a failure: runners vary up to 4x.
        env:
          NIRUX_TESTS_BUDGET: 500
          NIRUX_TESTS_ONLY: ${{ steps.select.outputs.only }}
        uses: ./.github/actions/ci-diagnostic
        with:
          command: suite
