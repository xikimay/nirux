name: Tests

# Runs the suite on every PR into main so mergeStateStatus reflects it before
# merge: an actor-isolation error in a test file once reached main red
# (2026-07-19, ActivityStoreTests). Not on push to main: the nightly
# (nightly.yml) already runs the tests there, and a second run held another
# macOS runner on every merge.
on:
  push:
    branches: [test/board-now-review-726]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # Xcode 26.3 (Swift 6.2) rather than the image's default 16.4 (Swift
    # 6.1): libghostty-spm 2.2 needs Swift tools 6.2.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # A serial run took 13 minutes: a hung test fails the job instead of
    # holding the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, as the nightly has it: a test that reads a
          # merged pull request's commits runs here, before merge, rather
          # than first in the nightly.
          fetch-depth: 0
          ref: 4df7fbe525d5624809a23dd5a2cefe6f935fc16f

      # The dependencies' clones and binaries (GhosttyKit's download sometimes
      # fails to connect), per toolchain: a new runner image's SwiftPM starts
      # afresh. A pull request reads the cache the nightly saves on main;
      # build products aren't cached (a stale one once crashed tests).
      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: scripts/run-tests.sh

      - name: Check both controller regressions against the reviewed revision
        run: |
          git restore --source=8e2c5e09 -- Sources/Nirux/Model/BoardStages.swift Sources/Nirux/Model/BoardStages+Facts.swift Sources/Nirux/Model/ProjectBoard.swift Sources/Nirux/Model/ProjectBoard+GitHub.swift
          swift build --build-tests
          filter='BoardStagesContentFlowTests/(testTheContentIsWhatTheTableListsAsStages|testARepositorysPillSaysWhatWentWrongOrThatItHasNoSettings)'
          if swift test --skip-build --filter "$filter" > "$RUNNER_TEMP/before.log" 2>&1; then
            cat "$RUNNER_TEMP/before.log"
            exit 1
          fi
          grep 'error:.*Merge manually.*Merge blocked by GitHub' "$RUNNER_TEMP/before.log"
          grep 'error:.*GitHub status unavailable.*Wait for the design review' "$RUNNER_TEMP/before.log"
