name: Tests

# Runs the suite on every PR into main so mergeStateStatus reflects it before
# merge: an actor-isolation error in a test file once reached main red
# (2026-07-19, ActivityStoreTests). Not on push to main: the nightly
# (nightly.yml) already runs the tests there, and a second run held another
# macOS runner on every merge.
on:
  push:
    branches: [test/check-waiting-launch-after-666]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # Xcode 26.3 (Swift 6.2) rather than the image's default 16.4 (Swift
    # 6.1): libghostty-spm 2.2 needs Swift tools 6.2.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # A serial run took 13 minutes: a hung test fails the job instead of
    # holding the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, as the nightly has it: a test that reads a
          # merged pull request's commits runs here, before merge, rather
          # than first in the nightly.
          fetch-depth: 0
          ref: ac4d9060b1fe046f92219de51c0ac9cc54675e8f

      # The dependencies' clones and binaries (GhosttyKit's download sometimes
      # fails to connect), per toolchain: a new runner image's SwiftPM starts
      # afresh. A pull request reads the cache the nightly saves on main;
      # build products aren't cached (a stale one once crashed tests).
      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Exercise the resolved immediate and deferred launches
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = ac4d9060b1fe046f92219de51c0ac9cc54675e8f
          swift test --filter 'WaitingTaskFlowTests|NewTaskFlowTests|HandoverFileTests|LeadToolsFlowTests/testTheLeadStartsFollowsAndHandsOverATask' 2>&1 | tee "$RUNNER_TEMP/launch.log"
          grep -E "testImmediateAndReleasedStartsDeliverTheSelectedAgentsHandover.*passed" "$RUNNER_TEMP/launch.log"

      - name: Detect a missing waiting-task guard and an incorrect agent handover
        run: |
          method=testImmediateAndReleasedStartsDeliverTheSelectedAgentsHandover
          for file in ExternalTools NewTask; do
            path="Sources/Nirux/Views/NiruxShellView+$file.swift"
            if [[ "$file" == ExternalTools ]]; then
              sed -i '' 's/guard let workspace = activeWorkspace, !workspace.isWaitingTask,/guard let workspace = activeWorkspace,/' "$path"
            else
              sed -i '' 's/handoverFilename: HandoverFile.filename(for: request.agent)/handoverFilename: HandoverFile.filename(for: .claude)/' "$path"
            fi
            if swift test --filter "WaitingTaskFlowTests/$method" > "$RUNNER_TEMP/$file.log" 2>&1; then exit 1; fi
            grep -m1 -E ": error: .*$method.*XCTAssert" "$RUNNER_TEMP/$file.log"
            git restore "$path"
          done

      - name: Exercise the intermediate Board dependency order
        run: |
          set -o pipefail
          git switch --detach e0c49323bd3fad9f4a365fdb4621dcc2191ba09a
          swift test --filter 'BoardStages(Units|ContentFlow)Tests' 2>&1 | tee "$RUNNER_TEMP/intermediate.log"
          grep -E 'testWaitingWorkspaceFollowsItsDependencyAcrossSectionsUntilRelease.*passed' "$RUNNER_TEMP/intermediate.log"

      - name: Exercise the simulated Board stack
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          git switch --detach 779c8e34aaf75825a1dc4870124706ec819bb5fe
          test "$(git rev-parse HEAD)" = 779c8e34aaf75825a1dc4870124706ec819bb5fe
          swift test --filter 'BoardStages(Line|Units|ContentFlow|View|Readings|ReadingsShell)Tests|WaitingTaskFlowTests/testImmediateAndReleasedStartsDeliverTheSelectedAgentsHandover' 2>&1 | tee "$RUNNER_TEMP/board.log"
          grep -E 'testWaitingWorkspaceFollowsItsDependencyAcrossSectionsUntilRelease.*passed' "$RUNNER_TEMP/board.log"
