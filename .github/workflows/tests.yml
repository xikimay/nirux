name: Tests

# DO NOT MERGE: measures `swift test --parallel` against a class-level runner.
on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  class-queue:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build --build-tests
      - name: 6 workers, run 1
        run: scripts/run-tests.sh 6
      - name: 6 workers, run 2
        if: always()
        run: scripts/run-tests.sh 6
      - name: 6 workers, run 3
        if: always()
        run: scripts/run-tests.sh 6
      - name: 8 workers, run 1
        if: always()
        run: scripts/run-tests.sh 8
      - name: 8 workers, run 2
        if: always()
        run: scripts/run-tests.sh 8
