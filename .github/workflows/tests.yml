name: Tests

# Runs the suite on every PR into main so mergeStateStatus reflects it before
# merge: an actor-isolation error in a test file once reached main red
# (2026-07-19, ActivityStoreTests). Not on push to main: the nightly
# (nightly.yml) already runs the tests there, and a second run held another
# macOS runner on every merge.
#
# A draft runs only the test classes its changes reach, under its own check
# name, "test (selected)". The full suite, the "test" check, runs once the
# pull request is marked ready and on every push after: a draft never shows
# a "test" check, passed or skipped, that a merge could read.
on:
  pull_request:
    branches: [ci/fast-ci-selection-proof-base]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ github.event.pull_request.draft && 'test (selected)' || 'test' }}
    runs-on: macos-15
    # Xcode 26.3 (Swift 6.2) rather than the image's default 16.4 (Swift
    # 6.1): libghostty-spm 2.2 needs Swift tools 6.2.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # A serial run took 13 minutes: a hung test fails the job instead of
    # holding the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, as the nightly has it: a test that reads a
          # merged pull request's commits runs here, before merge, rather
          # than first in the nightly.
          fetch-depth: 0

      # The dependencies' clones and binaries (GhosttyKit's download sometimes
      # fails to connect), per toolchain: a new runner image's SwiftPM starts
      # afresh. A pull request reads the cache the nightly saves on main;
      # build products aren't cached (a stale one once crashed tests).
      - name: Toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      # Validation fixture from #682, with just the fuzzy matcher unit class omitted.
      - name: Seed the deliberately incomplete coverage index
        if: github.event.pull_request.draft
        run: cp scripts/ci-selection-proof-index.txt .build/coverage-index.txt
      - uses: actions/cache/save@v6
        if: github.event.pull_request.draft
        with:
          path: .build/coverage-index.txt
          key: coverage-index-v2-${{ github.event.pull_request.base.sha }}
      - name: Clear the fixture before exercising the normal restore
        if: github.event.pull_request.draft
        run: rm .build/coverage-index.txt

      # The latest index the Coverage map workflow saved on main.
      - name: Coverage index
        id: coverage
        if: github.event.pull_request.draft
        uses: actions/cache/restore@v6
        with:
          path: .build/coverage-index.txt
          key: coverage-index-v2-${{ github.event.pull_request.base.sha }}
          restore-keys: coverage-index-v2-

      - name: Select tests
        id: select
        env:
          INDEX_KEY: ${{ steps.coverage.outputs.cache-matched-key }}
        if: github.event.pull_request.draft
        run: |
          revision="${INDEX_KEY#coverage-index-v2-}"
          if [[ ! -s .build/coverage-index.txt || ! $revision =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$revision" HEAD^1; then
            echo "No coverage index from the base history. Running the whole suite."
            exit 0
          fi
          git diff --no-renames --name-only -z "$revision" HEAD > "$RUNNER_TEMP/changed"
          swift test list --skip-build | cut -d/ -f1 | sort -u > "$RUNNER_TEMP/test-classes"
          status=0
          scripts/select-tests.sh .build/coverage-index.txt "$RUNNER_TEMP/test-classes" < "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/selected" || status=$?
          if [[ $status -eq 0 ]]; then
            echo "$(wc -l < "$RUNNER_TEMP/selected" | tr -d ' ') classes selected:"
            cat "$RUNNER_TEMP/selected"
            echo "only=$RUNNER_TEMP/selected" >> "$GITHUB_OUTPUT"
          elif [[ $status -ne 3 ]]; then
            exit "$status"
          fi

      - name: Run tests
        env:
          ONLY: ${{ steps.select.outputs.only }}
        run: |
          if [[ -n $ONLY ]]; then
            scripts/run-tests.sh --only "$ONLY"
          else
            scripts/run-tests.sh
          fi
