name: Packaged app canary

on: workflow_dispatch

permissions:
  contents: read

jobs:
  canary:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the ad-hoc bundle
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          set -o pipefail
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          scripts/bundle.sh 0.0.0 0 2>&1 | tee -a "$RUNNER_TEMP/evidence/build.log"
      - name: Test the runner
        run: /usr/bin/python3 -B -m unittest discover -s scripts/canary -v
      - name: Run the canary
        run: |
          status=0
          scripts/canary.sh Nirux.app --evidence-dir "$RUNNER_TEMP/evidence" || status=$?
          report=$(find "$RUNNER_TEMP/evidence" -name report.json -print -quit)
          if [[ -f "$report" ]]; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("**" + r["verdict"] + "**", r["steps"][-1].get("reason", ""))' "$report" >> "$GITHUB_STEP_SUMMARY"
            if [[ $status == 2 && $(jq -r .verdict "$report") == infra_unavailable ]]; then
              echo "::warning::Canary inconclusive. See the graphical session preflight in report.json."
              exit 0
            fi
          fi
          exit "$status"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nirux-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
