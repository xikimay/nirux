name: Packaged app canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Canary mode (triage or qualify)
        default: triage
        type: choice
        options:
          - triage
          - qualify
      scenario:
        description: Scenario to run (or 'all', or 'selected' with diff_base)
        default: ghostty-monaco-restore
        type: choice
        options:
          - ghostty-monaco-restore
          - multi-agent-routing
          - sidebar-breakpoints
          - all
          - selected
      diff_base:
        description: Git base ref for scenario='selected' (e.g. origin/main or HEAD~1)
        default: ""
        type: string
      repro_runs:
        description: Fresh-state replays on initial non-infra failure (triage mode)
        default: "2"
        type: string
      qualify_runs:
        description: Consecutive clean passes required (qualify mode)
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build the ad-hoc bundle
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/history"
          set -o pipefail
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          scripts/bundle.sh 0.0.0 0 2>&1 | tee -a "$RUNNER_TEMP/evidence/build.log"
      - name: Test the runner
        run: /usr/bin/python3 -B -m unittest discover -s scripts/canary -v
      - name: Run the canary
        env:
          CANARY_MODE: ${{ inputs.mode || 'triage' }}
          CANARY_SCENARIO: ${{ inputs.scenario || 'ghostty-monaco-restore' }}
          CANARY_DIFF_BASE: ${{ inputs.diff_base || '' }}
          REPRO_RUNS: ${{ inputs.repro_runs || '2' }}
          QUALIFY_RUNS: ${{ inputs.qualify_runs || '5' }}
        run: |
          status=0
          scenario_args=()
          if [[ "$CANARY_SCENARIO" == "selected" ]]; then
            base="${CANARY_DIFF_BASE:-HEAD~1}"
            scenario_args=(--diff-base "$base")
          else
            scenario_args=(--scenario "$CANARY_SCENARIO")
          fi
          if [[ "$CANARY_MODE" == "qualify" ]]; then
            scripts/canary.sh Nirux.app "${scenario_args[@]}" --qualify "$QUALIFY_RUNS" --evidence-dir "$RUNNER_TEMP/evidence" || status=$?
            for qual in $(find "$RUNNER_TEMP/evidence" -name qualification.json | sort); do
              python3 -c 'import json,sys; q=json.load(open(sys.argv[1])); print(f"- `{q[\"scenario\"]}`: **{q[\"verdict\"]}** passRate={q[\"passRate\"]} ({q[\"passedRuns\"]}/{q[\"requestedRuns\"]}) mean={q[\"timing\"][\"meanMs\"]}ms stddev={q[\"timing\"][\"stddevMs\"]}ms")' "$qual" >> "$GITHUB_STEP_SUMMARY"
            done
            if [[ $status == 2 ]]; then
              echo "::warning::Canary qualification inconclusive. See the graphical session preflight in report.json."
              exit 0
            fi
          else
            scripts/canary.sh Nirux.app "${scenario_args[@]}" --triage --repro-runs "$REPRO_RUNS" \
              --evidence-dir "$RUNNER_TEMP/evidence" \
              --history-dir "$RUNNER_TEMP/history" \
              --commit "$GITHUB_SHA" || status=$?
            for triage in $(find "$RUNNER_TEMP/evidence" -name triage.json | sort); do
              python3 -c 'import json,sys; t=json.load(open(sys.argv[1])); extra=f" fp={t[\"fingerprint\"]}" if t.get("fingerprint") else ""; crash=" (crash observed)" if t.get("hasCrash") else ""; reopened=" [REOPENED]" if t.get("reopened") else ""; print(f"- `{t[\"scenario\"]}`: **{t[\"classification\"]}**{extra}{crash}{reopened}")' "$triage" >> "$GITHUB_STEP_SUMMARY"
            done
            if [[ $status == 2 ]]; then
              echo "::warning::Canary inconclusive. See the graphical session preflight in report.json."
              exit 0
            fi
          fi
          exit "$status"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nirux-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/history
          if-no-files-found: warn
