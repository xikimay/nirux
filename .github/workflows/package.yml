name: Package

# The nightly packages and publishes only from main. A pull request that
# changes how the app is built or bundled packages it here first, the way the
# nightly does (ad-hoc signed), and checks the packaged terminal runtime.
on:
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - Package.resolved
      - scripts/bundle.sh
      - .github/workflows/nightly.yml
      - .github/workflows/package.yml

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version; xcodebuild -version

      - name: Build release
        run: swift build -c release --build-system swiftbuild

      - name: Bundle .app
        run: ./scripts/bundle.sh 0.0.0 0

      - name: Check the packaged app's terminal runtime
        run: Nirux.app/Contents/MacOS/Nirux --check-terminal-runtime
