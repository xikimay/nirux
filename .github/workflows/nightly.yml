name: Nightly Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Main keeps its group; a manual dispatch from any other branch (whose job is
# skipped below) gets its own, so it cannot cancel a publish from main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'nightly-release' || format('nightly-release-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Publishing ships to every Nirux install through Sparkle, so only main may
    # publish, even from a manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate signing and notarization secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
            SPARKLE_PRIVATE_KEY \
            APPLE_DEVELOPER_ID_APPLICATION \
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 \
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/nirux-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "NIRUX_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_DEVELOPER_ID_APPLICATION"; then
            echo "::error::Developer ID signing identity not found: $APPLE_DEVELOPER_ID_APPLICATION"
            exit 1
          fi
      - name: Extract version info
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          VERSION="nightly-${BUILD_NUMBER:0:4}.${BUILD_NUMBER:4:2}.${BUILD_NUMBER:6:2}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # One immutable release per build, kept for rollbacks. The time keeps a
          # re-run of the same commit from colliding with its earlier release.
          RELEASE_TAG="$VERSION-${BUILD_NUMBER:8:4}-$SHORT_SHA"
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"
          echo "Building $VERSION (build $BUILD_NUMBER, release $RELEASE_TAG)"

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Bundle .app
        env:
          NIRUX_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: ./scripts/bundle.sh "$VERSION" "$BUILD_NUMBER"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit Nirux.app.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple Nirux.app
          xcrun stapler validate Nirux.app
          spctl --assess --type execute --verbose=4 Nirux.app

          rm -f Nirux.app.zip
          ditto -c -k --keepParent Nirux.app Nirux.app.zip

      - name: Sign and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sign the zip with Sparkle's EdDSA key (pass private key via stdin)
          SIGN_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - Nirux.app.zip)
          # sign_update outputs: sparkle:edSignature="..." length="..."
          SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [[ -z "$SIGNATURE" || -z "$LENGTH" ]]; then
            echo "Error: Failed to parse sign_update output: $SIGN_OUTPUT"
            exit 1
          fi

          echo "Signature: $SIGNATURE"
          echo "Length: $LENGTH"

          ./scripts/generate-appcast.sh "$VERSION" "$BUILD_NUMBER" "$SIGNATURE" "$LENGTH" "$RELEASE_TAG"

      - name: Write release notes
        run: |
          # Capture the previous nightly's commit BEFORE the rolling tag moves —
          # the changelog diffs against it.
          PREV_SHA=$(git rev-parse -q --verify 'nightly^{commit}' || echo "")
          if [ -n "$PREV_SHA" ]; then
            RANGE="$PREV_SHA..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          CHANGELOG=$(git log --pretty=format:'- %s (%h)' --no-merges "$RANGE" || echo "- maintenance")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- maintenance"
          fi

          NOTES_FILE="$RUNNER_TEMP/nightly-notes.md"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          cat > "$NOTES_FILE" <<EOF
          Automated nightly build from main branch.

          **Version:** $VERSION
          **Build:** $BUILD_NUMBER
          **Commit:** $SHORT_SHA
          **Release:** [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)

          ## Changes
          $CHANGELOG

          This build is Developer ID signed, notarized by Apple, and signed for Sparkle updates.

          Download \`Nirux.app.zip\`, unzip, and move \`Nirux.app\` to /Applications.
          Earlier builds stay available as dated \`nightly-*\` releases; see docs/release-signing.md to roll back.
          EOF

      - name: Refuse to publish a stale commit
        run: |
          # Re-running an old run keeps its original commit; publishing it would
          # ship older code under a newer build number to every install.
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is no longer the head of main ($MAIN_SHA); not publishing."
            exit 1
          fi

      - name: Publish dated nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published before the rolling release, whose appcast points at this
          # release's zip. Never replaced: a tag collision fails the run instead.
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG (build $BUILD_NUMBER)" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            Nirux.app.zip \
            appcast.xml

      - name: Update rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `nightly` is what SUFeedURL and the README point at. Update it in
          # place: its appcast only references dated zips, so replacing the zip
          # first and the appcast last leaves the feed missing only while the
          # small appcast re-uploads. The tag, which the next changelog diffs
          # against, moves only once the release holds this build.
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Nightly ($VERSION)" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload nightly Nirux.app.zip --clobber
            gh release upload nightly appcast.xml --clobber
            git push --force origin "$GITHUB_SHA:refs/tags/nightly"
          else
            git push --force origin "$GITHUB_SHA:refs/tags/nightly"
            gh release create nightly \
              --title "Nightly ($VERSION)" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              Nirux.app.zip \
              appcast.xml
          fi

      - name: Prune old dated nightly releases
        # The new build is already published; a failed cleanup must not turn
        # the run red, only leave more dated releases behind.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DATED_RELEASES: 20
        run: |
          set -o pipefail
          # Only tags this workflow creates match; `nightly` itself never does.
          # Sort by publish time: a release's createdAt is its commit's date.
          gh release list --limit 200 --json tagName,publishedAt \
            | jq -r --argjson keep "$KEEP_DATED_RELEASES" '
                [.[] | select(.tagName | test("^nightly-[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]{4}-[0-9a-f]{7,40}$"))]
                | sort_by(.publishedAt) | reverse | .[$keep:] | .[].tagName' \
            > "$RUNNER_TEMP/prune-tags.txt"

          while read -r tag; do
            if [ "$tag" = "$RELEASE_TAG" ]; then
              continue
            fi
            echo "Deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes \
              || echo "::warning::Could not delete old nightly release $tag"
          done < "$RUNNER_TEMP/prune-tags.txt"

      - name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${NIRUX_SIGNING_KEYCHAIN:-}" && -f "$NIRUX_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$NIRUX_SIGNING_KEYCHAIN" || true
          fi
